name: pi-gateway
services:
  # Init container
  init:
    image: busybox
    container_name: init
    user: root
    volumes:
      - shared_data:/shared
    command: >
      sh -c "mkdir -p /shared &&
           [ -f /shared/domains.txt ] || echo '.invalid' > /shared/domains.txt &&
           [ -f /shared/passwd ] || touch /shared/passwd &&
           [ -f /shared/db.sqlite3 ] || touch /shared/db.sqlite3 &&
           chmod 777 /shared &&
           chmod 644 /shared/domains.txt /shared/passwd &&
           chmod 666 /shared/db.sqlite3"
    restart: "no"

  # Docker socket proxy
  socket-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: socket-proxy
    restart: always
    environment:
      - CONTAINERS=1
      - POST=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - internal

  # Squid proxy
  squid:
    container_name: squid
    build: ./squid
    depends_on:
      init:
        condition: service_completed_successfully
    restart: always
    ports:
      - "3128:3128"
    volumes:
      - shared_data:/shared
      - squid_logs:/var/log/squid
    entrypoint: >
        sh -c "
          mkdir -p /var/log/squid &&
          chown -R proxy:proxy /var/log/squid &&
          chmod 644 /shared/domains.txt /shared/passwd &&
          squid -N
        "
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "squid -k check || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # API сервис
  api:
    container_name: api
    build: ./api
    depends_on:
      init:
        condition: service_completed_successfully
      squid:
        condition: service_started
      socket-proxy:
        condition: service_started
    restart: always
    environment:
      - API_SECRET_KEY=${API_SECRET_KEY}
      - DOMAIN=${DOMAIN}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SQUID_CONTAINER=squid
      - DOCKER_HOST=tcp://socket-proxy:2375
      - DOMAINS_FILE=/shared/domains.txt
      - HTPASSWD_FILE=/shared/passwd
      - DB_URL=sqlite+aiosqlite:////shared/db.sqlite3
    volumes:
      - shared_data:/shared
      - squid_logs:/var/log/squid:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # UI сервис
  ui:
    container_name: ui
    build: ./ui
    restart: always
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Caddy для HTTPS
  caddy:
    container_name: caddy
    build: ./caddy
    depends_on:
      api:
        condition: service_started
      ui:
        condition: service_started
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - ACME_EMAIL=${ACME_EMAIL}
      - DOMAIN=${DOMAIN}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./caddy/Caddyfile.active:/etc/caddy/Caddyfile
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  internal:
    driver: bridge

volumes:
  shared_data:
  squid_logs:
  caddy_data:
  caddy_config: