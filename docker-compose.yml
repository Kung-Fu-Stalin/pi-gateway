name: pi-gateway

services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: socket-proxy
    restart: always
    environment:
      - CONTAINERS=1
      - POST=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - internal

  caddy:
    container_name: caddy
    depends_on:
      api:
        condition: service_healthy
      ui:
        condition: service_started
    build: ./caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - ACME_EMAIL=${ACME_EMAIL}
      - DOMAIN=${DOMAIN}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  squid:
    container_name: squid
    build: ./squid
    restart: always
    ports:
      - "3128:3128"
    volumes:
      - shared_data:/shared
      - squid_logs:/var/log/squid
    entrypoint: >
      sh -c "rm -f /run/squid.pid &&
             chown -R proxy:proxy /var/log/squid &&
             mkdir -p /shared &&
             touch /shared/domains.txt /shared/passwd /shared/db.sqlite3 &&
             chmod 666 /shared/domains.txt /shared/passwd /shared/db.sqlite3 &&
             ln -sf /shared/domains.txt /etc/squid/domains.txt &&
             ln -sf /shared/passwd /etc/squid/passwd &&
             squid -N"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "squidclient", "-h", "localhost", "mgr:info"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  api:
    container_name: api
    depends_on:
      squid:
        condition: service_healthy
      socket-proxy:
        condition: service_started
    build: ./api
    restart: always
    environment:
      - API_SECRET_KEY=${API_SECRET_KEY}
      - DOMAIN=${DOMAIN}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SQUID_CONTAINER=squid
      - DOCKER_HOST=tcp://socket-proxy:2375
      - DOMAINS_FILE=/shared/domains.txt
      - HTPASSWD_FILE=/shared/passwd
      - DB_URL=sqlite+aiosqlite:////shared/db.sqlite3
    volumes:
      - shared_data:/shared
      - squid_logs:/var/log/squid:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  ui:
    container_name: ui
    build: ./ui
    restart: always
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  internal:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  squid_logs:
  shared_data: