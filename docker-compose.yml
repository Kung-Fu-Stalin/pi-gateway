name: pi-gateway

services:
  init:
    image: busybox
    container_name: init
    user: root
    volumes:
      - shared_data:/shared
    command: >
      sh -c "mkdir -p /shared &&
             touch /shared/domains.txt /shared/passwd /shared/db.sqlite3 &&
             chown -R 1000:1000 /shared &&
             chmod -R 770 /shared"
    restart: "no"

  socket-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: socket-proxy
    restart: always
    environment:
      - CONTAINERS=1
      - POST=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - internal

  squid:
    container_name: squid
    build: ./squid
    depends_on:
      - init
    restart: always
    user: "1000:1000"
    ports:
      - "3128:3128"
    volumes:
      - shared_data:/shared
      - squid_logs:/var/log/squid
    entrypoint: >
      sh -c "mkdir -p /var/log/squid &&
             ln -sf /shared/domains.txt /etc/squid/domains.txt &&
             ln -sf /shared/passwd /etc/squid/passwd &&
             squid -N"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "squid -k check || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  api:
    container_name: api
    build: ./api
    depends_on:
      - squid
      - socket-proxy
      - init
    restart: always
    environment:
      - API_SECRET_KEY=${API_SECRET_KEY}
      - DOMAIN=${DOMAIN}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SQUID_CONTAINER=squid
      - DOCKER_HOST=tcp://socket-proxy:2375
      - DOMAINS_FILE=/shared/domains.txt
      - HTPASSWD_FILE=/shared/passwd
      - DB_URL=sqlite+aiosqlite:////shared/db.sqlite3
    volumes:
      - shared_data:/shared
      - squid_logs:/var/log/squid:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  ui:
    container_name: ui
    build: ./ui
    restart: always
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    container_name: caddy
    build: ./caddy
    depends_on:
      - api
      - ui
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - ACME_EMAIL=${ACME_EMAIL}
      - DOMAIN=${DOMAIN}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  internal:
    driver: bridge

volumes:
  shared_data:
  squid_logs:
  caddy_data:
  caddy_config:
