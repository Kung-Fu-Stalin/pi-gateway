<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">

<g transform="translate(50, 50)">
  <!-- Shield -->
  <path d="M0,-46 L37,-30 L37,8 Q37,40 0,52 Q-37,40 -37,8 L-37,-30 Z"
        fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <path d="M0,-40 L32,-26 L32,8 Q32,35 0,46 Q-32,35 -32,8 L-32,-26 Z"
        fill="#0d1f3c" stroke="#0ea5e9" stroke-width="0.5"/>

  <!-- Raspberry: Row top 2 -->
  <circle cx="-5"  cy="-13" r="5.2" fill="#c0392b"/>
  <circle cx="5"   cy="-13" r="5.2" fill="#c0392b"/>
  <!-- Row mid 3 -->
  <circle cx="-10" cy="-4"  r="5.2" fill="#e74c3c"/>
  <circle cx="0"   cy="-4"  r="5.2" fill="#e74c3c"/>
  <circle cx="10"  cy="-4"  r="5.2" fill="#e74c3c"/>
  <!-- Row bot 2 -->
  <circle cx="-5"  cy="5"   r="5.2" fill="#c0392b"/>
  <circle cx="5"   cy="5"   r="5.2" fill="#c0392b"/>

  <!-- Highlights -->
  <circle cx="-6.5" cy="-15" r="1.5" fill="#ff8a80" opacity="0.6"/>
  <circle cx="3.5"  cy="-15" r="1.5" fill="#ff8a80" opacity="0.6"/>
  <circle cx="-11"  cy="-6"  r="1.5" fill="#ff8a80" opacity="0.6"/>
  <circle cx="-1"   cy="-6"  r="1.5" fill="#ff8a80" opacity="0.6"/>
  <circle cx="9"    cy="-6"  r="1.5" fill="#ff8a80" opacity="0.6"/>
  <circle cx="-6.5" cy="3"   r="1.5" fill="#ff8a80" opacity="0.6"/>
  <circle cx="3.5"  cy="3"   r="1.5" fill="#ff8a80" opacity="0.6"/>

  <!-- Stem -->
  <path d="M0,-18 Q1,-25 3,-29" fill="none" stroke="#2d6a2d" stroke-width="1" stroke-linecap="round"/>

  <!-- Leaves -->
  <path d="M3,-29 Q9,-36 4,-32 Q6,-27 2,-29 Z" fill="#27ae60"/>
  <path d="M3,-29 Q-5,-37 -1,-32 Q-5,-27 -2,-29 Z" fill="#2ecc71"/>
  <path d="M3,-29 Q10,-29 5,-27 Z" fill="#27ae60"/>
